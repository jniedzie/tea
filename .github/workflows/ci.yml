name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux (EL9, correctionlib ${{ matrix.correctionlib }})
    runs-on: ubuntu-24.04
    container: almalinux:9
    env:
      TEA_HOME: /tmp/tea-home
    strategy:
      fail-fast: false
      matrix:
        include:
          - correctionlib: "with"
            enable_correctionlib: "ON"
            expected_support: "ENABLED"
          - correctionlib: "without"
            enable_correctionlib: "OFF"
            expected_support: "DISABLED"
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Install container prerequisites
        run: dnf install -y ca-certificates curl findutils git gzip tar which

      - uses: actions/checkout@v6
        with:
          submodules: false

      - name: Create and inspect the locked build environment
        run: |
          source environment/activate.sh
          tea_env_activate
          cmake --version
          c++ --version
          python3 --version
          root-config --version
          correction config --version
          ci/collect-environment.sh el9 ci/tea-environment-el9.txt
          cat ci/tea-environment-el9.txt

      - name: Check shell prompt preservation
        run: bash --noprofile --norc -i ci/test-shell-prompt.sh

      - name: Configure
        run: |
          source environment/activate.sh
          tea_env_activate
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DTEA_ENABLE_CORRECTIONLIB=${{ matrix.enable_correctionlib }} \
            | tee configure.log
          grep -F "TEA correctionlib support: ${{ matrix.expected_support }}" configure.log

      - name: Build and install
        run: |
          source environment/activate.sh
          tea_env_activate
          cmake --build build --parallel 2 --target install

      - name: Run standalone example smoke tests
        run: |
          source environment/activate.sh
          tea_env_activate
          ctest --test-dir build --output-on-failure

  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-14
    env:
      TEA_HOME: ${{ runner.temp }}/tea-home
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - name: Create and inspect the locked build environment
        run: |
          source environment/activate.sh
          tea_env_activate
          cmake --version
          c++ --version
          python3 --version
          root-config --version
          correction config --version
          ci/collect-environment.sh macos-arm64 ci/tea-environment-macos-arm64.txt
          cat ci/tea-environment-macos-arm64.txt

      - name: Check shell prompt preservation
        run: bash --noprofile --norc -i ci/test-shell-prompt.sh

      - name: Configure
        run: |
          source environment/activate.sh
          tea_env_activate
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build and install
        run: |
          source environment/activate.sh
          tea_env_activate
          cmake --build build --parallel 2 --target install

      - name: Run standalone example smoke tests
        run: |
          source environment/activate.sh
          tea_env_activate
          ctest --test-dir build --output-on-failure
