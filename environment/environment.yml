name: tea
channels:
  - conda-forge
dependencies:
  - clang-format=19.1.7
  - cmake=3.31.8
  - conda-pack=0.9.1
  - correctionlib=2.8.0
  - cxx-compiler
  - make
  - pre-commit=4.6.2
  - pytest=8.4.1
  - python=3.12
  # root_base contains ROOT, PyROOT, root-config, and hadd. The root
  # metapackage also installs Jupyter, IPython, Numba, and Fortran compilers.
  - root_base=6.34.10
  - ruff=0.16.3
  - zlib=1.3.2
platforms:
  - linux-64
  - osx-arm64
  - osx-64
