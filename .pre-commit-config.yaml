exclude: |
  (?x)^(
    jsonPOG/|
    data/|
    samples/|
    DSAMuonSF/.*\.json$|
    libs/extensions/include/NanoMETXYCorr_METPhi\.hpp$
  )

repos:
  - repo: local
    hooks:
      - id: format-python-tables
        name: format Python tables
        entry: python3 scripts/format_python_tables.py
        language: system
        types: [python]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.7
    hooks:
      - id: clang-format
        types_or: [c++, c]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
